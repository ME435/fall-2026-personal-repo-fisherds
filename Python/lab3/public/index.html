<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateloader</title>
</head>
<body>
    <!-- This is a comment. -->
    <h1>Serial Server</h1>
    <p>This is the HTML client. There is also a MATLAB frontend.</p>

    <div id="replyText">the reply will go here</div>
    <hr>
    <button id="reset">RESET</button>
    <br><br>

    <button id="x1">X-Axis 1</button>
    <button id="x2">X-Axis 2</button>
    <button id="x3">X-Axis 3</button>
    <button id="x4">X-Axis 4</button>
    <button id="x5">X-Axis 5</button>
    <br><br>

    <button id="zExtend">Z-Axis Extend</button>
    <button id="zRetract">Z-Axis Retract</button>
    <br><br>

    <button id="gOpen">Gripper Open</button>
    <button id="gClose">Gripper Close</button>
    <br><br>

    <input type="number" value="1" id="moveFrom">
    <input type="number" value="5" id="moveTo">
    <button id="move">Move</button>
    <br><br>

    <button id="status">Loader Status</button>
    <br><br>

    <script src="main.js"></script>
</body>
</html>
